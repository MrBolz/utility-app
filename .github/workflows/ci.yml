name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # Pages serves the site under /<repo>/; other builds use the root.
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    permissions:
      # Publishes the APK as the android-latest GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk utility-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: utility-app-apk
          path: utility-app.apk
      - name: Publish the APK
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest utility-app.apk --target "$GITHUB_SHA" \
            --title "Android app (latest)" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download utility-app.apk on your phone and open it to install or update."
